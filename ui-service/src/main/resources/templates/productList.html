<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Product Management RRB</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Google Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />

    <style>
        .card {
            font-family: 'Poppins', sans-serif;
        }
        .category-rect {
            height: 60px;
            border-radius: 0.375rem;
            box-shadow: 0 0.125rem 0.25rem rgb(0 0 0 / 0.075);

        }
    </style>
</head>
<body>
<header th:replace="~{fragments/header.html :: shared_header}"></header>

<main>
    <div class="container my-4">
        <h3 class="mb-4">Available products</h3>

        <!-- Search Form -->
        <div class="row mb-4">
            <form th:action="@{/search}" method="get" class="d-flex align-items-center gap-2">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search for product" style="width: 250px;" />
                <button class="btn btn-outline-secondary" type="submit">Search</button>
                <button class="btn btn-outline-secondary" type="submit" name="reset" value="true">Reset</button>
            </form>
        </div>

        <!-- Products Grid -->
        <div class="row g-3">
            <div th:each="product : ${productList}" class="col-sm-6 col-md-4 col-lg-3 d-flex">
                <div class="card flex-fill">
                    <div th:style="
                          ${product.category != null and product.category.name() == 'SHOES'} ? 'background-color: #e3e8e6;' :
                          (${product.category != null and product.category.name() == 'CLOTHES'} ? 'background-color: #e3e8e6;' : 'background-color: #e3e8e6;')"
                         class="category-rect">
                    </div>

                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                        <p class="card-text mb-1"><strong>Description:</strong> <span th:text="${product.description}"></span></p>
                        <p class="card-text mb-1"><strong>Category:</strong> <span th:text="${product.category}"></span></p>
                        <p class="card-text mb-1"><strong>Price:</strong> <span th:text="${product.price}"></span> Eur</p>
                        <p class="card-text mb-1"><strong>Left in store:</strong> <span th:text="${product.quantity}"></span></p>
                        <p class="card-text mb-3"><strong>Sold:</strong> <span th:text="${product.initialQuantity - product.quantity}"></span></p>

                        <div class="mt-auto d-flex gap-2">

                            <form th:if="${username != null}"
                                  th:action="@{/delete/{id}(id=${product.id})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete?');"
                                  style="display:inline;">
                                <button class="btn btn-danger" type="submit" title="Delete">&#10008;</button>
                            </form>

                            <a th:if="${username != null}"
                               th:href="@{/edit/{id}(id=${product.id})}"
                               class="btn btn-primary"
                               role="button"
                               title="Edit">&#9998;</a>
                            <form th:action="@{/sell-product/{id}(id=${product.id})}" method="post" th:if="${product.getQuantity() != 0}" style="display:inline;">
                                <button class="btn btn-success" type="submit">Buy</button>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Bootstrap JS Bundle (Popper included) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
