<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Product Management</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light text-dark">

<!-- Header Fragment -->
<header th:fragment="shared_header" class="container-fluid bg-black text-white p-3 mb-3 d-flex align-items-center">
    <div class="d-flex flex-column flex-md-row align-items-center justify-content-center flex-grow-1 gap-3">
        <h1 class="mb-0">Product Management</h1>
        <nav class="d-flex align-items-center gap-2">
            <a th:if="${username != null}" class="btn btn-light" href="/add-product">Add Product</a>
            <a class="btn btn-light" href="/">View Products</a>

            <div class="dropdown">
                <button class="btn btn-light dropdown-toggle" type="button" id="dropdownMenuButton1"
                        data-bs-toggle="dropdown" aria-expanded="false">
                    Sort Products By
                </button>
                <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                    <a class="dropdown-item" th:href="@{/products(sortBy='name')}">NAME</a>
                    <a class="dropdown-item" th:href="@{/products(sortBy='description')}">DESCRIPTION</a>
                    <a class="dropdown-item" th:href="@{/products(sortBy='category')}">CATEGORY</a>
                    <a class="dropdown-item" th:href="@{/products(sortBy='price')}">PRICE</a>
                </ul>
            </div>

            <!-- Show login dropdown if user NOT logged in -->
            <div th:if="${username == null}" class="dropdown">
                <button class="btn btn-light dropdown-toggle" type="button" id="loginDropdown" data-bs-toggle="dropdown"
                        aria-expanded="false">
                    Login
                </button>
                <div class="dropdown-menu p-4" style="min-width: 300px;">
                    <form th:action="@{/login}" method="post">
                        <input type="email" name="username" placeholder="Email" required/>
                        <input type="password" name="password" placeholder="Password" required/>
                        <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
                        <!-- Show error message if present -->
                        <div th:if="${errorMessage}" style="color:red;" th:text="${errorMessage}"></div>
                    </form>
                </div>
            </div>

            <!-- Show welcome and logout if user IS logged in -->
            <span th:if="${username != null}" class="d-flex align-items-center gap-2">
    <span>Welcome, <strong th:text="${username}">User</strong>!</span>
    <a class="btn btn-light" href="/logout">Logout</a>
</span>
        </nav>
    </div>
</header>

<!-- Main content placeholder -->
<div class="container">
    <h2>Products list will go here</h2>
    <!-- Your product list or main page content -->
</div>

<!-- Bootstrap JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
